<!DOCTYPE html>
<html>
<head>
    <title>Speech to Text Test</title>
</head>

<body>

    <h2>🎤 Speech to Text</h2>

    <button type="button" id="start">Start Recording</button>
    <button  type="button" id="stop" disabled>Stop Recording</button>

    <p id="status"></p>

    <h3>Transcription:</h3>
    <p id="result"></p>

    <script>
        window.addEventListener("beforeunload", (event) => {
            console.log("PAGE IS RELOADING!");
        });
        console.log("Script loaded!");
        let recorder;
let audioChunks = [];

const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const status = document.getElementById("status");
const result = document.getElementById("result");

startButton.addEventListener("click", async () => {

    console.log("START BUTTON CLICKED");

    const stream = await navigator.mediaDevices.getUserMedia({
        audio: true
    });

    recorder = new MediaRecorder(stream);

    audioChunks = [];

    recorder.ondataavailable = (event) => {
        audioChunks.push(event.data);
    };

    recorder.onstop = async () => {

        console.log("RECORDING STOPPED");

        const audioBlob = new Blob(audioChunks, {
            type: "audio/webm"
        });

        console.log("AUDIO BLOB CREATED");

        const formData = new FormData();

        formData.append("audio", audioBlob, "recording.webm");

        console.log("SENDING AUDIO TO SERVER");

        status.textContent = "Sending audio to server...";

        try {

            const response = await fetch(
                "http://localhost:5000/api/speech/transcribe",
                {
                    method: "POST",
                    body: formData
                }
            );

            console.log("SERVER RESPONSE RECEIVED");

            const data = await response.json();

            console.log("GROQ Response:",data);
            alert(JSON.stringify(data));

            if (response.ok) {
                status.textContent = "Transcription successful!";
                result.textContent = data.text;
            } else {
                status.textContent = "Transcription failed.";
                result.textContent = data.message;
            }

        } catch (error) {

            console.log("FETCH ERROR:", error);

            status.textContent = "Could not connect to server.";
        }
    };

    recorder.start();

    console.log("RECORDING STARTED");

    status.textContent = "Recording... Speak now!";

    startButton.disabled = true;
    stopButton.disabled = false;
});


stopButton.addEventListener("click", (event) => {

    event.preventDefault();

    console.log("STOP BUTTON CLICKED");

    recorder.stop();

    console.log("RECORDER STOP CALLED");

    status.textContent = "Processing...";

    startButton.disabled = false;
    stopButton.disabled = true;
});
    </script>

</body>
</html>
